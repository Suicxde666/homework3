<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Page v2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Contact Me</h1>
        <p>ส่งข้อความเพื่อติดต่อสอบถามหรือพูดคุยเรื่องโปรเจกต์ได้ที่นี่</p>
        
        <form action="#" method="get">
            <div class="form-group">
                <label for="name">ชื่อ - นามสกุล:</label>
                <input type="text" id="name" name="name" required placeholder="กรอกชื่อของคุณ">
            </div>
            <div class="form-group">
                <label for="email">อีเมล:</label>
                <input type="email" id="email" name="email" required placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label for="message">ข้อความ:</label>
                <textarea id="message" name="message" rows="5" required placeholder="พิมพ์ข้อความที่ต้องการ..."></textarea>
            </div>
            <button type="submit" class="btn">ส่งข้อความ</button>
        </form>

        <a href="index.html" class="btn" style="background-color: #888; margin-top: 15px;">กลับไปหน้าหลัก</a>
    </div>
</body>
</html>
